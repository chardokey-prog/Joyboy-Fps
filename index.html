<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joyboy Fps - DOMINATE THE ARENA</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;color:#fff;font-family:Inter,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;background:#111;border-bottom:1px solid #222;position:sticky;top:0;z-index:99}
.logo{font-weight:700} .logo span{color:#f5c65c}
.btn-gold{background:linear-gradient(135deg,#f5c65c,#d8a23a);color:#000;padding:10px 18px;border-radius:20px;font-weight:700;border:none}
.hero{padding:24px 20px}
.hero h1{font-family:'Space Grotesk';font-size:40px;line-height:0.9}
.hero h1 .gold{color:#f5c65c;display:block;-webkit-text-stroke:1px #f5c65c;color:transparent}
.desc{opacity:0.6;font-size:13px;margin-top:12px;line-height:1.6;max-width:340px}
.actions{display:flex;gap:10px;margin-top:20px}
.btn{padding:12px 18px;border-radius:10px;font-weight:700;font-size:12px;border:1px solid #333}
.btn-p{background:#1c1c28;color:#fff}
.btn-s{background:rgba(245,198,92,0.1);color:#f5c65c;border-color:#f5c65c}
.visual{position:relative;width:100%;max-width:360px;aspect-ratio:1/1;margin:30px auto 0}
.circle{position:absolute;width:88%;height:88%;left:6%;top:6%;border-radius:50%;background:radial-gradient(circle at 30% 30%,#2a2a40,#0f0f15);border:1px solid #333}
.card{position:absolute;background:#181828;border:1px solid #333;border-radius:12px;padding:8px 12px;font-size:10px}
.card b{color:#f5c65c;display:block;font-size:11px}
.c1{top:5%;right:0} .c2{top:50%;left:-10px} .c3{bottom:5%;right:10%}
</style>
</head>
<body>
<header><div class="logo">◈ Joyboy <span>Fps</span></div><button class="btn-gold">PLAY NOW</button></header>
<div class="hero">
<h1>DOMINATE<span class="gold">THE ARENA</span></h1>
<div class="desc">Next-Gen Tactical FPS • 240Hz • 6ms Low Latency. Built for legends.</div>
<div class="actions"><button class="btn btn-p">↓ Download Beta</button><button class="btn btn-s">▶ Trailer</button></div>
<div class="visual"><div class="circle"></div><div class="card c1">LOW LATENCY<b>6ms AVG</b></div><div class="card c2">RAY TRACING<b>ON • DLSS 3.5</b></div><div class="card c3">RANKED<b>ELO 2200+</b></div></div>
</div>
</body>
</html>
