body{background:#000;color:#fff;font-family:'Poppins',sans-serif;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-2;background:linear-gradient(120deg,#000,#1a0a00,#5a0000,#000);background-size:400% 400%;animation:move 8s ease infinite}

.upload{border:2.5px dashed #ffcc00;border-radius:16px;padding:28px 10px;text-align:center;cursor:pointer}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-weight:900;font-size:15px;margin-top:12px}
.btn-main{background:linear-gradient(90deg,#ff0000,#ff8800,#ffcc00);color:#000}
