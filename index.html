<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOYBOY FPS - HD OPTIMIZER</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:#000;color:#fff;min-height:100vh}
.bg{position:fixed;inset:0;z-index:-3;background:linear-gradient(120deg,#000,#2a0a00,#5a0000,#000);background-size:400% 400%;animation:mv 7s ease infinite}
@keyframes mv{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.luffy{position:fixed;inset:0;z-index:-2;background:url('https://media.tenor.com/4iaE8A5O2BwAAAAC/luffy-gear5.gif') center/cover;opacity:.16}
.container{max-width:440px;margin:0 auto;padding:16px}
.logo{font-family:'Bangers';font-size:60px;line-height:.85;background:linear-gradient(#fff,#ffe600,#ff3300);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px #f00);text-align:center}
.owner{background:linear-gradient(90deg,#ff0000,#ff8800);display:inline-block;padding:7px 20px;border-radius:30px;border:2px solid #ffcc00;font-weight:800;margin-top:8px;font-size:12px}
.card{margin-top:16px;background:rgba(15,5,5,.9);border:2px solid #ff3300;border-radius:22px;padding:16px;box-shadow:0 0 30px rgba(255,50,0,.45)}
.preview{width:100%;min-height:200px;border-radius:14px;background:#111;border:2px dashed #ff6600;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img,.preview video{max-width:100%;max-height:350px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.meta div{background:rgba(255,100,0,.12);border:1px solid #ff4400;padding:8px;border-radius:10px;font-size:11px;text-align:center}
.meta b{color:#ffe600;display:block;font-size:13px}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.btn-main{background:linear-gradient(90deg,#ff0000,#ff8800,#ffcc00);color:#000}
.btn-wa{background:#25D366;color:#fff;display:none;justify-content:center}
.tutor{background:rgba(0,255,100,.08);border:1px solid #00ff88;border-radius:12px;padding:12px;margin-top:12px;display:none;font-size:11px;line-height:1.6}
</style>
</head>
<body>
<div class="bg"></div><div class="luffy"></div>
<div class="container">
<div style="text-align:center;padding:20px 0 8px">
<div style="letter-spacing:4px;font-size:10px;color:#ffaa77">OFFICIAL BY</div>
<div class="logo">JOYBOY<br>FPS</div>
<div class="owner">OWNER: JOYBOY FPS 👒</div>
</div>
<div class="card">
<div class="preview" id="preview"><span style="color:#ff8855;font-size:12px">👒 Preview HD</span></div>
<div class="meta">
<div>📏 Resolusi<b id="res">-</b></div>
<div>💾 Ukuran<b id="size">-</b></div>
<div>🎬 Kualitas<b id="fps">-</b></div>
<div>✅ HD<b id="hd">READY</b></div>
</div>
<div style="border:2.5px dashed #ffcc00;border-radius:14px;padding:20px;text-align:center;margin-top:12px" onclick="document.getElementById('fileIn').click()">📸 PILIH FOTO / VIDEO<input type="file" id="fileIn" accept="image/*,video/*" hidden></div>
<button class="btn btn-main" id="btnOpt">⚡ OPTIMIZE HD - JOYBOY FPS ⚡</button>
<button class="btn btn-wa" id="btnDown">⬇️ DOWNLOAD HD ASLI</button>
<div class="tutor" id="tutor"><b>CARA SW JERNIH 37MB:</b><br>1. Download HD<br>2. WA > Status > Kirim sebagai Dokumen<br>3. Pilih file HD tadi<br>4. Hasil jernih asli - Owner JOYBOY FPS</div>
</div>
</div>
<script>
let file=null,url=null;
const preview=document.getElementById('preview'),fileIn=document.getElementById('fileIn');
fileIn.addEventListener('change',e=>{file=e.target.files[0];if(!file)return;url=URL.createObjectURL(file);preview.innerHTML='';if(file.type.startsWith('image')){let i=document.createElement('img');i.src=url;i.onload=()=>res.textContent=i.naturalWidth+'x'+i.naturalHeight;preview.appendChild(i);fps.textContent='Foto HD'}else{let v=document.createElement('video');v.src=url;v.controls=true;v.onloadedmetadata=()=>{res.textContent=v.videoWidth+'x'+v.videoHeight;fps.textContent='Video HD'};preview.appendChild(v);}size.textContent=(file.size/1024/1024).toFixed(2)+' MB';});
btnOpt.onclick=()=>{if(!file){alert('Pilih dulu Joyboy!');return}btnDown.style.display='flex';tutor.style.display='block';};
btnDown.onclick=()=>{let a=document.createElement('a');a.href=url;a.download='JOYBOY-FPS-'+file.name;a.click();};
</script>
</body>
</html>
